[project]
name = "clientsoutreach-safe-leads"
version = "1.0.0"
description = "Safe Lead Scraper from Google Maps"
readme = "README.md"
authors = [
    { name = "Telzeez", email = "Abdlazeezolasunkanmi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.64.1",
    "playwright-stealth>=1.0.6",
    "pydantic>=2.0",
    "openpyxl>=3.1.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lead_scraper_google_maps"
